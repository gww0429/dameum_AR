<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111316">
<title>AR 전시</title>
<link rel="stylesheet" href="css/app.css?v=3.10">
<script type="importmap">
{ "imports": {
  "three": "./lib/three/three.module.js",
  "three/addons/": "./lib/three/addons/"
} }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chevL" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-chevR" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-chevD" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-chevU" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-4-6-1.5S9 8 12 8zm0 0c2-4 6-4 6-1.5S15 8 12 8z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<main>
<!-- 카메라·3D 무대 -->
<div id="stage" hidden></div>

<!-- V0 인앱 브라우저 안내 -->
<section id="v0" class="scr light center" hidden>
  <div class="cgroup">
    <h1 class="lg">다른 브라우저로 열어 주세요</h1>
    <p class="msg" id="v0Msg"></p>
    <div class="acts">
      <button class="abtn primary" id="v0Open"></button>
      <button class="abtn secondary" id="v0Stay">그래도 여기서 시도</button>
    </div>
  </div>
</section>

<!-- V1 홈 배경 그림(프리셋 · 홈 이미지 블러): 화면 전체(431px 이상이면 앱 바깥까지) -->
<div class="hbg" id="homeBg" hidden aria-hidden="true"></div>

<!-- V1 홈: 배경 + 홈 이미지 + 버튼 두 개 -->
<section id="v1" class="scr homev" hidden>
  <div class="himg" id="homeImgBox"></div>
  <div class="hbar">
    <p class="hnote" id="homeNote" hidden>준비 중인 행사입니다</p>
    <div class="row">
      <button class="abtn secondary" id="homeBox"><svg class="i"><use href="#i-gift"/></svg>선물 상자<span class="pill" id="homeBoxN" hidden>0</span></button>
      <button class="abtn primary wrap2" id="homeStart"><span class="lbl" id="homeStartTxt">AR 시작하기</span></button>
    </div>
  </div>
</section>

<!-- V2 준비·오류 -->
<section id="v2" class="scr dark center" hidden>
  <div class="cgroup">
    <div class="spin" id="v2Spin"></div>
    <h1 class="lg" id="v2Title">준비 중</h1>
    <p class="msg" id="v2Msg"></p>
    <div class="acts" id="v2Acts"></div>
  </div>
</section>

<!-- V3 스캔 · V4 인식 후 -->
<section id="cam" class="scr" hidden>
  <div class="touch" id="touch"></div>
  <div class="topbar">
    <span class="chip status dim" id="camState"><i class="dot" hidden></i><span class="ell" id="camStateTxt">포스터를 찾는 중</span></span>
    <span class="r"><span class="chip" id="camPv" hidden>미리보기</span><button class="chip btn" id="camExit">종료</button></span>
  </div>
  <div class="notice" id="camNotice" hidden><span class="chip wide"><span class="ell" id="camNoticeTxt"></span></span></div>
  <div id="scanUi">
    <div class="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
    <div class="guide"><span class="chip wide"><span class="ell">포스터 전체가 화면에 들어오게 비춰 주세요</span></span></div>
  </div>
  <div class="mload" id="mload" hidden><div class="spin s20"></div></div>
  <div id="mlayer"></div>
  <div class="sheet mcard" id="card" hidden></div>
  <canvas class="fx" id="fx" hidden aria-hidden="true"></canvas>
</section>

<!-- V5 사은품 시트 -->
<div class="scrim" id="giftScrim" hidden></div>
<section id="gift" class="scr" hidden>
  <div class="sheet" id="giftSheet" role="dialog" aria-modal="true" aria-labelledby="giftTitle">
    <div class="handle"></div>
    <div class="body" id="giftBody">
      <div class="xs" id="giftHead" style="margin-top:12px"></div>
      <div class="lg" id="giftTitle"></div>
      <p class="sm t2" id="giftNote" hidden></p>
      <div class="gimg" id="giftImgBox" hidden></div>
      <p class="sm t2" id="giftDesc" style="margin-top:12px" hidden></p>
      <div class="kv" id="giftClaim" hidden><span class="k">받는 곳</span><span id="giftClaimTxt"></span></div>
      <p class="xs t2" id="giftNoSave" style="margin-top:12px;font-weight:400" hidden>이 브라우저에서는 선물이 저장되지 않아요</p>
    </div>
    <button class="abtn primary" id="giftOk">확인</button>
  </div>
</section>

<!-- V7 선물 상자 -->
<section id="v7" class="scr light box" hidden>
  <div class="appbar"><button class="ib back" id="boxBack" aria-label="홈으로"><svg class="i i24"><use href="#i-chevL"/></svg><span class="bl" id="boxBackTxt" hidden>AR</span></button><span class="ttl" id="boxTtl">선물 상자</span><span class="slot" id="boxSlot"><span class="ptag" id="boxPv" hidden>미리보기</span></span></div>
  <div class="scroll"><div class="body" id="boxBody"></div></div>
  <div class="bar"><p class="note" id="boxNote" hidden>수령할 선물이 없습니다</p><button class="abtn primary" id="boxStaff">직원 확인</button></div>
</section>

<!-- V8 직원 확인 -->
<section id="v8" class="scr light" hidden>
  <div class="appbar"><button class="ib" id="staffBack" aria-label="뒤로"><svg class="i"><use href="#i-chevL"/></svg></button><span class="ttl">직원 확인</span><span class="slot"></span></div>
  <div class="scroll"><div class="staff" id="staffBody"></div></div>
  <div class="bar"><button class="abtn primary" id="staffOk">확인</button></div>
</section>

</main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
/* file:// 안내: 모듈 스크립트는 file://에서 브라우저가 막으므로, 모듈보다 먼저 도는 일반 스크립트로 안내 화면을 띄운다. */
if (location.protocol === 'file:') {
  document.getElementById('v2Spin').hidden = true;
  document.getElementById('v2Title').textContent = 'HTTPS 주소가 필요합니다';
  document.getElementById('v2Msg').textContent = '파일로 열면 설정을 읽을 수 없습니다. 배포된 https:// 주소나 로컬 서버(serve.ps1)로 열어 주세요.';
  document.getElementById('v2Msg').hidden = false;
  document.getElementById('v2').hidden = false;
}
</script>
<script type="module" src="js/app.js?v=3.10"></script>
</body>
</html>
